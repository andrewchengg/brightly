# Rate limiting zone
limit_req_zone $binary_remote_addr zone=one:10m rate=30r/m;

# Define proxy cache zone
proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=STATIC:10m max_size=10g inactive=60m use_temp_path=off;

# Upstream for Next.js
upstream nextjs_upstream {
    server localhost:3000;
    keepalive 64;
}

# HTTP server block
server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src * self blob: data: gap:; style-src * self blob: data: gap:; script-src * self blob: data: gap:; object-src * self blob: data: gap:; img-src * self blob: data: gap:; connect-src self * blob: data: gap:; frame-src * self blob: data: gap:;";

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;
    gzip_min_length 1000;

    # Buffer settings
    client_header_buffer_size 16k;
    large_client_header_buffers 4 16k;
    client_body_buffer_size 128k;
    client_max_body_size 10m;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;

    # Rate limiting
    limit_req zone=one burst=10 nodelay;

    # Proxy for root application routes
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # Important: Allow WebSocket connections
        proxy_set_header Connection "upgrade";
    }

    # Static file caching
    location /_next/static {
        proxy_cache STATIC;
        proxy_pass http://nextjs_upstream;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=3600, immutable";
    }

    location /static {
        proxy_cache STATIC;
        proxy_ignore_headers Cache-Control;
        proxy_cache_valid 60m;
        proxy_pass http://nextjs_upstream;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, max-age=3600, immutable";
    }

    # Block sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
